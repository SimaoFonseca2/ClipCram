[package]
name = "clipcram"
version = "1.0.0"
description = "Trim and squeeze videos under Discord's upload limit"
license = "MIT"
edition = "2021"
rust-version = "1.88"
resolver = "3"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
rfd = "0.15"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
open = "5"

[profile.release]
strip = true
lto = "thin"
